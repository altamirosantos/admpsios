<div class="grid">


    <div class="col-12">
        <div class="card">
            <h5>Termometros</h5>
            <!--p-toggleButton  [onIcon]="'pi pi-lock'" offIcon="pi pi-lock-open"
                [onLabel]="'Unfreeze Id'" offLabel="Freeze Id" [style]="{'width': '12rem'}"></!--p-toggleButton-->

            <p-table [value]="termometros" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
                styleClass="mt-3" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:200px" pFrozenColumn>Nome</th>
                        <th style="width:200px">Sentimento</th>
                        <th style="width:200px">Orientação</th>
                        <th style="width:200px">Figura</th>
                        <th style="width:200px">OP</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-termometro>
                    <tr>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{termometro.name}}</td>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{termometro.sentimento}}</td>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{termometro.orientacao}}</td>
                        <td style="width:200px">
                            <img src="assets/demo/images/flag/flag_placeholder.png"
                                 width="30">
                            <span class="image-text ml-2">{{termometro.image_url}}</span>
                        </td>
                        <td style="width:200px">{{termometro.id}} Editar</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <h5>Aconselhamentos</h5>
            <!--p-toggleButton  [onIcon]="'pi pi-lock'" offIcon="pi pi-lock-open"
                [onLabel]="'Unfreeze Id'" offLabel="Freeze Id" [style]="{'width': '12rem'}"></!--p-toggleButton-->

            <p-table [value]="aconselhamentos" scrollDirection="both" [scrollable]="true" scrollHeight="400px"
                styleClass="mt-3" responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:200px" pFrozenColumn>Nome</th>
                        <th style="width:200px">Tipo</th>
                        <th style="width:200px">OP</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-aconselhamento>
                    <tr>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{aconselhamento.nome}}</td>
                        <td style="width:200px">
                            <img src="assets/demo/images/flag/flag_placeholder.png"
                                 width="30">
                            <span class="image-text ml-2">{{aconselhamento.tipo}}</span>
                        </td>
                        <td style="width:200px">{{aconselhamento.id}} Editar</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>
