<div class="grid">


    <div class="col-12">
        <div class="card">
            <h5>Perguntas</h5>

            <p-table [value]="perguntas" scrollDirection="both"
            [loading]="loading"
            selectionMode="single"
            [(selection)]="perguntaSelecionada"
            [scrollable]="true" scrollHeight="400px"
            styleClass="p-datatable-striped clickable-rows mt-3"
            responsiveLayout="scroll"
            (onRowClick)="onRowClick($event)">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:100px" pFrozenColumn>Nome</th>
                        <th style="width:200px">Descrição</th>
                        <!--th style="width:200px">OP</th-->

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-pergunta let-rowIndex="rowIndex">
                    <tr (click)="selectPergunta(pergunta)" [pSelectableRow]="pergunta">
                        <td style="width:100px" pFrozenColumn class="font-bold">{{pergunta.nome}}</td>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{pergunta.descricao}}</td>
                        <td style="width:200px">
                            <!--button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                                (click)="editTermometro(pergunta)"></button-->
                            <!--button pButton pRipple type="button" icon="pi pi-trash" class="p-button-rounded p-button-text" (click)="()"></button></td-->
                    </tr>
                </ng-template>
            </p-table>
        </div>
        <p-dialog [(visible)]="perguntaDialog" [style]="{width: '450px'}" header="Termometro detalhes" [modal]="true"
            class="p-fluid">
            <ng-template pTemplate="content">
                <!--img [src]="'assets/demo/images/product/' + product.image" [alt]="product.image" width="150" class="mt-0 mx-auto mb-5 block shadow-2" *ngIf="product.image"-->
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" pInputText id="titulo" [(ngModel)]="pergunta.name" required autofocus
                        [ngClass]="{'ng-invalid ng-dirty' : submitted && !pergunta.name}" />
                    <small class="ng-dirty ng-invalid" *ngIf="submitted && !pergunta.name">Nome é obrigatório.</small>
                </div>
                <div class="field">
                    <label for="description">Sentimento</label>
                    <textarea id="description" pInputTextarea [(ngModel)]="pergunta.sentimento" required rows="3"
                        cols="20"></textarea>
                </div>

                <div class="field">
                    <label for="description">Orientação</label>
                    <textarea id="description" pInputTextarea [(ngModel)]="pergunta.orientacao" required rows="3"
                        cols="20"></textarea>
                </div>


            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                    (click)="hideTermometroDialog()"></button>
                <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text"
                    (click)="saveTermometro()"></button>
            </ng-template>
        </p-dialog>
    </div>

    <div class="col-12">

        <div class="card">
            <div>
                <button pButton pRipple icon="pi pi-plus" class="p-button-rounded p-button-success mr-2"
                    (click)="addItem()"></button>
            </div>
            <h5>Respostas </h5>
            <!--p-toggleButton  [onIcon]="'pi pi-lock'" offIcon="pi pi-lock-open"
                [onLabel]="'Unfreeze Id'" offLabel="Freeze Id" [style]="{'width': '12rem'}"></!--p-toggleButton-->

            <p-table
            [value]="respostas"
            scrollDirection="both"
            [loading]="loadingResp"
            [scrollable]="true" scrollHeight="400px"
            styleClass="p-datatable-striped mt-3"
            responsiveLayout="scroll">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:200px" pFrozenColumn>Resposta</th>
                        <th style="width:200px">Devolutiva</th>
                        <th style="width:50px">OP</th>

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-resposta>
                    <tr>
                        <td style="width:200px" pFrozenColumn class="font-bold">{{resposta.descricao}}</td>
                        <td style="width:200px">
                            <img src="assets/demo/images/flag/flag_placeholder.png" width="30">
                            <span class="image-text ml-2">{{resposta.devolutiva}}</span>
                        </td>
                        <td style="width:50px">
                            <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                                (click)="editItem(resposta)"></button>
                            <!--button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                (click)="deleteItem(resposta)"></button-->
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>


        <p-dialog [(visible)]="respostaDialog" [style]="{width: '600px'}" header="Respostas detalhes"
            [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">
                <!--img [src]="'assets/demo/images/product/' + product.image" [alt]="product.image" width="150" class="mt-0 mx-auto mb-5 block shadow-2" *ngIf="product.image"-->
                <div class="field">
                    <label for="descricao">Resposta</label>
                    <textarea id="descricao" pInputTextarea [(ngModel)]="resposta.descricao" required rows="3"
                        cols="20" disabled></textarea>
                </div>

                <div class="field">
                    <label for="devolutiva">Devolutiva</label>
                    <textarea id="devolutiva" pInputTextarea [(ngModel)]="resposta.devolutiva" required rows="10"
                        cols="20"></textarea>
                </div>

            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Cancel" icon="pi pi-times" class="p-button-text"
                    (click)="hideRespostaDialog()"></button>
                <button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text"
                    (click)="saveResposta()"></button>
            </ng-template>
        </p-dialog>


        <p-dialog [(visible)]="deleteItemDialog" header="Confirmação" [modal]="true" [style]="{width:'450px'}">
            <div class="flex align-items-center justify-content-center">
                <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
                <span *ngIf="resposta">Confirma exclusão <b>{{resposta.descricao}}</b>?</span>
            </div>
            <ng-template pTemplate="footer">
                <button pButton pRipple icon="pi pi-times" class="p-button-text" label="No"
                    (click)="deleteItemDialog = false"></button>
                <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Yes"
                    (click)="confirmDeleteItem()"></button>
            </ng-template>
        </p-dialog>
    </div>
</div>
