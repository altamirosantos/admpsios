<div class="grid">


    <div class="col-12">
        <div class="card">
            <h5>Resources</h5>

            <p-table [value]="autoavaliacoes" scrollDirection="both" [loading]="loading" selectionMode="single"
                [(selection)]="perguntaSelecionada" [scrollable]="true" scrollHeight="400px"
                styleClass="p-datatable-striped clickable-rows mt-3" responsiveLayout="scroll"
                (onRowClick)="onRowClick($event)">
                <ng-template pTemplate="header">
                    <tr>
                        <th style="width:100px" pFrozenColumn>Titulo</th>
                        <th style="width:100px" pFrozenColumn>Tipo</th>
                        <th style="width:100px" pFrozenColumn>Descrição</th>
                        <th style="width:100px" pFrozenColumn>Tags</th>
                        <th style="width:100px" pFrozenColumn>Data</th>
                        <!--th style="width:200px">Devolutiva</th-->
                        <!--th style="width:200px">OP</th-->

                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-autoavaliacao let-rowIndex="rowIndex">
                    <tr (click)="selectPergunta(autoavaliacao)" [pSelectableRow]="autoavaliacao">
                        <td style="width:100px" pFrozenColumn class="font-bold">{{autoavaliacao.title}}</td>
                        <td style="width:100px" pFrozenColumn class="font-bold">{{autoavaliacao.type}}</td>
                        <td style="width:100px" pFrozenColumn class="font-bold">{{autoavaliacao.description}}</td>
                        <td style="width:100px" pFrozenColumn class="font-bold">{{autoavaliacao.tags}}</td>
                        <td style="width:100px" pFrozenColumn class="font-bold">{{autoavaliacao.created_at | date:
                            'dd/MM/yyyy HH:mm'}}</td>
                        <!--td style="width:200px" pFrozenColumn class="font-bold">{{autoavaliacao.diagnostico}}</td-->
                        <td style="width:200px">
                            <button pButton pRipple icon="pi pi-eye" class="p-button-rounded p-button-success mr-2"
                                (click)="editDevolutiva(autoavaliacao)"></button>
                            <!--button pButton pRipple type="button" icon="pi pi-trash" class="p-button-rounded p-button-text" (click)="()"></button></td-->
                    </tr>
                </ng-template>
            </p-table>
        </div>
        <p-dialog [(visible)]="perguntaDialog" [style]="{width: '750px'}" header="Painel de Autoavaliação"
            [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">

                <div class="field">
                    <label for="description">Perguntas</label>
                    <textarea id="description" pInputTextarea [(ngModel)]="autoavaliacao.dados_entrada" required
                        rows="10" cols="50"></textarea>
                </div>
                <div class="field">
                    <label for="description">Devolutiva</label>
                    <textarea id="description" pInputTextarea [(ngModel)]="autoavaliacao.diagnostico" required rows="25"
                        cols="50"></textarea>
                </div>

            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Fechar" icon="pi pi-times" class="p-button-text"
                    (click)="hideDevolutivaDialog()"></button>
                <!--button pButton pRipple label="Save" icon="pi pi-check" class="p-button-text"
                    (click)="saveTermometro()"></button-->
            </ng-template>
        </p-dialog>
    </div>
</div>
