<p-toast></p-toast>

<div class="grid">
    <div class="col-12">
        <div class="card">
            <p-toolbar styleClass="mb-4">
                <ng-template pTemplate="left">
                    <div>
                        <h5 class="m-0">Serviços de Proposta</h5>
                        <small class="text-color-secondary">Cadastro da tabela <strong>servicos_proposta</strong>.</small>
                    </div>
                </ng-template>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="Novo serviço" icon="pi pi-plus" (click)="openNew()"></button>
                </ng-template>
            </p-toolbar>

            <p-table
                [value]="servicos"
                [loading]="loading"
                [paginator]="servicos.length > 10"
                [rows]="10"
                [globalFilterFields]="['nome', 'descricao']"
                responsiveLayout="scroll"
                styleClass="p-datatable-striped"
                #dt>
                <ng-template pTemplate="caption">
                    <div class="flex justify-content-end">
                        <span class="p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                                placeholder="Buscar serviço..." />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th scope="col" pSortableColumn="nome">Nome <p-sortIcon field="nome"></p-sortIcon></th>
                        <th scope="col">Descrição</th>
                        <th scope="col" style="width: 130px">Status</th>
                        <th scope="col" style="width: 120px">Ações</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-servico>
                    <tr>
                        <td class="font-bold">{{ servico.nome }}</td>
                        <td>{{ servico.descricao || '—' }}</td>
                        <td>
                            <p-tag [value]="statusLabel(servico.status)" [severity]="statusSeverity(servico.status)"></p-tag>
                        </td>
                        <td>
                            <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2"
                                (click)="editServico(servico)" pTooltip="Editar"></button>
                            <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-danger"
                                (click)="confirmDeleteServico(servico)" pTooltip="Excluir"></button>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="4">Nenhum serviço cadastrado.</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
    </div>
</div>

<p-dialog [(visible)]="servicoDialog" [style]="{ width: '520px' }" [modal]="true"
    [header]="servico.id ? 'Editar serviço' : 'Novo serviço'" class="p-fluid">
    <ng-template pTemplate="content">
        <div class="field">
            <label for="nome">Nome <span class="text-red-500">*</span></label>
            <input id="nome" type="text" pInputText [(ngModel)]="servico.nome" required autofocus
                [ngClass]="{ 'ng-invalid ng-dirty': submitted && !servico.nome?.trim() }" />
            <small class="p-error" *ngIf="submitted && !servico.nome?.trim()">O nome é obrigatório.</small>
        </div>

        <div class="field">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" pInputTextarea [(ngModel)]="servico.descricao" rows="4"></textarea>
        </div>

        <div class="field">
            <label for="status">Status</label>
            <p-dropdown inputId="status" [options]="statusOptions" [(ngModel)]="servico.status"
                optionLabel="label" optionValue="value" appendTo="body"></p-dropdown>
        </div>
    </ng-template>

    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Salvar" icon="pi pi-check" class="p-button-text" (click)="saveServico()"></button>
    </ng-template>
</p-dialog>

<p-dialog [(visible)]="deleteServicoDialog" header="Confirmação" [modal]="true" [style]="{ width: '450px' }">
    <div class="flex align-items-center justify-content-center">
        <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
        <span *ngIf="servico">Confirma exclusão do serviço <b>{{ servico.nome }}</b>?</span>
    </div>
    <ng-template pTemplate="footer">
        <button pButton pRipple icon="pi pi-times" class="p-button-text" label="Não" (click)="deleteServicoDialog = false"></button>
        <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sim" (click)="deleteServico()"></button>
    </ng-template>
</p-dialog>
